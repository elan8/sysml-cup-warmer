name: Verify and report

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUN42_VERSION: "0.1.0-beta.1"
  DOC42_VERSION: "0.8.2"

jobs:
  verify:
    name: Verify with Run42, report with Doc42
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Run42
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="run42-$RUN42_VERSION-linux-x64"
          mkdir -p "$RUNNER_TEMP/run42"
          gh release download "v$RUN42_VERSION" --repo elan8/run42-release \
            --pattern "$package.tar.gz" --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/run42"
          (cd "$RUNNER_TEMP/run42" && sha256sum --check --ignore-missing SHA256SUMS.txt && tar -xzf "$package.tar.gz")
          echo "RUN42=$RUNNER_TEMP/run42/$package/run42" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/run42/$package/run42" --version

      # Run42 needs an Elan8 API token; pull requests from forks cannot read the secret.
      - name: Verify the requirements
        env:
          ELAN8_TOKEN: ${{ secrets.ELAN8_TOKEN }}
        run: bash scripts/verify.sh

      - name: Compute the figures of the report from the recorded traces
        run: python3 scripts/report_data.py

      - name: Install Doc42
        uses: elan8/doc42-release@v0.8.2
        with:
          version: ${{ env.DOC42_VERSION }}

      - name: Check the documents
        run: doc42 check model --workspace-root .

      - name: Build the verification report
        env:
          ELAN8_TOKEN: ${{ secrets.ELAN8_TOKEN }}
        run: doc42 build model --workspace-root . --doc CupWarmerDocuments::report --out generated

      - name: Upload the report and the verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: |
            generated/*.pdf
            build/verdicts.json
            build/alternative-verdicts.json
            build/alternative.md
            build/results.md
            build/figures/*.svg
          if-no-files-found: warn
          retention-days: 14

      # With the repository variable PUBLISH_PAGES set to true (Settings, Pages, Source: GitHub Actions), a push to main
      # publishes the report, with a small index page that records the commit and the tool versions.
      - name: Write the index page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
        run: |
          mkdir -p site
          cp generated/CW-VR-001.pdf site/
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Cup warmer: verification report</title></head>
          <body style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5">
          <h1>Cup warmer: verification report</h1>
          <p>The report is built from the SysML v2 model by <a href="https://github.com/elan8/doc42-release">Doc42</a>, with the verdicts and traces of <a href="https://github.com/elan8/run42-release">Run42</a>.</p>
          <p><a href="CW-VR-001.pdf">Read the report (PDF)</a> · <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}">Explore the model</a></p>
          <p style="color: #555; font-size: 0.9rem">Built from commit <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}">${GITHUB_SHA:0:7}</a> with Run42 ${RUN42_VERSION} and Doc42 ${DOC42_VERSION}.</p>
          </body></html>
          HTML

      - name: Upload the Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    name: Publish the report
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
